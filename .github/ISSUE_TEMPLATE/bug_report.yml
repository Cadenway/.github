name: Bug report
description: Report a reproducible problem in this repository.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Please use the repository security policy to report them privately.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence and relevant context.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and additional context
      description: Include the affected version or commit and relevant environment details. Remove secrets and personal data.
